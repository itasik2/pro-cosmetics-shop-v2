name: Apply admin products workspace patch

on:
  push:
    branches:
      - feat/admin-products-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-products-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-admin-products-workspace.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "app/admin/(private)/products/AdminProductsClient.tsx" \
            "app/admin/(private)/products/DraftProductsPublisher.tsx" \
            app/shop/page.tsx \
            app/api/products/route.ts
          git commit -m "Уплотнить страницу товаров и обновлять список после объединения"
          git push
