name: Catalog Hub Web

on:
  push:
    branches:
      - "feature/catalog-hub-web-app"
    paths:
      - "catalog-hub-web/**"
      - "catalog-hub-local/**"
      - "marketplace-hub/src/ai/photo-identity.ts"
      - "marketplace-hub/src/ai/verified-photos.ts"
      - "marketplace-hub/src/ai/official-sources.ts"
      - "marketplace-hub/src/ai/tilda-product.ts"
      - ".github/workflows/catalog-hub-web.yml"
  pull_request:
    paths:
      - "catalog-hub-web/**"
      - "catalog-hub-local/**"
      - "marketplace-hub/src/ai/photo-identity.ts"
      - "marketplace-hub/src/ai/verified-photos.ts"
      - "marketplace-hub/src/ai/official-sources.ts"
      - "marketplace-hub/src/ai/tilda-product.ts"
      - ".github/workflows/catalog-hub-web.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-hub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalog-hub-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Check isolated database scripts syntax
        run: |
          node --check ../catalog-hub-local/setup.mjs
          node --check ../catalog-hub-local/switch.mjs
      - name: Import match tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          CATALOG_HUB_API_URL: https://example.invalid
          CATALOG_HUB_API_KEY: ci-placeholder
          CATALOG_HUB_ORGANIZATION_ID: org_ci
          CATALOG_HUB_WAREHOUSE_ID: wh_ci
        run: npm run build
