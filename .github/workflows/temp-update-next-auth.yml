name: TEMP Update NextAuth

on:
  push:
    branches:
      - security/update-next-auth

permissions:
  contents: write

jobs:
  update-next-auth:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/procosmetics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Update Auth dependencies
        run: |
          npm install next-auth@5.0.0-beta.32 nodemailer@8.0.11 --save-exact --no-audit --no-fund
          npm install @types/nodemailer@8.0.1 --save-dev --save-exact --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Audit critical production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "security: update auth dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
