name: Marketplace Hub

on:
  pull_request:
    paths:
      - "marketplace-hub/**"
      - ".github/workflows/marketplace-hub.yml"
  push:
    branches:
      - main
    paths:
      - "marketplace-hub/**"
      - ".github/workflows/marketplace-hub.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketplace-hub/package.json

      - name: Install
        run: npm install

      - name: Validate Prisma
        run: npm run db:validate

      - name: Generate Prisma
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build service
        run: npm run build
