name: Apply stale source retry patch

on:
  push:
    branches:
      - fix/enrichment-stale-source-retry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-stale-source-retry
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-stale-source-retry.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/enrichment/runProductEnrichment.ts
          git commit -m "Повторять поиск при устаревшем URL источника"
          git push
