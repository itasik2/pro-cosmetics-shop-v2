name: Apply enrichment variant stocks patch

on:
  push:
    branches:
      - feat/automatic-price-variants

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-price-variants
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-enrichment-variant-stocks.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/'(private)'/enrichment/AdminEnrichmentClient.tsx
          git commit -m "Добавить остатки по вариантам в автозаполнение"
          git push
