name: Fix variant merge JSON

on:
  push:
    branches:
      - feat/automatic-price-variants

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-price-variants
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-variant-merge-json.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/products/variant-merge/route.ts
          git commit -m "Исправить JSON архива вариантов"
          git push
