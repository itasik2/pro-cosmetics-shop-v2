name: Apply product search patch

on:
  push:
    branches:
      - feat/product-search

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-search
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix patch generator
        run: node scripts/fix-product-search-patch.mjs
      - name: Apply patch
        run: node scripts/patch-product-search.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/shop/page.tsx "app/admin/(private)/products/AdminProductsClient.tsx"
          git commit -m "Добавить поиск товаров в каталог и админку"
          git push
