name: Apply product extraction patch

on:
  push:
    branches:
      - fix/product-page-title-and-loader
    paths:
      - scripts/patch-product-extraction.mjs
      - .github/workflows/apply-product-extraction-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/product-page-title-and-loader
          fetch-depth: 0

      - name: Apply targeted patch
        run: node scripts/patch-product-extraction.mjs

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/enrichment/extractProduct.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Исправить заголовок, цену и служебные изображения"
            git push origin HEAD:fix/product-page-title-and-loader
          fi
