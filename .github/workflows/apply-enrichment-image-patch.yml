name: Apply enrichment image patch

on:
  push:
    branches:
      - fix/enrichment-image-selection
    paths:
      - scripts/patch-enrichment-images.mjs
      - .github/workflows/apply-enrichment-image-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/enrichment-image-selection
          fetch-depth: 0

      - name: Apply targeted patch
        run: node scripts/patch-enrichment-images.mjs

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/admin/(private)/enrichment/AdminEnrichmentClient.tsx" "lib/enrichment/extractProduct.ts"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Исправить выбор и загрузку изображений"
            git push origin HEAD:fix/enrichment-image-selection
          fi
