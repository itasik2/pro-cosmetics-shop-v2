name: Remove duplicate admin search

on:
  push:
    branches:
      - fix/remove-duplicate-admin-search

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-duplicate-admin-search
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/remove-duplicate-admin-search.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/admin/(private)/products/AdminProductsClient.tsx"
          git commit -m "Убрать дублирующую форму поиска товаров"
          git push
