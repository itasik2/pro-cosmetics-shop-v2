name: TEMP Next 15 Async API Codemod

on:
  push:
    branches:
      - security/next-15-lts

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/procosmetics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --silent

      - name: Run official Next async request API codemod
        run: npx --yes @next/codemod@latest next-async-request-api .

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate route types
        run: npx next typegen

      - name: TypeScript check
        run: npm run typecheck

      - name: Commit codemod result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: migrate Next 15 async route params"
          git push origin HEAD:${GITHUB_REF_NAME}
