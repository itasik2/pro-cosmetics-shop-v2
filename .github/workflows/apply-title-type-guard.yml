name: Apply title type guard

on:
  push:
    branches:
      - fix/product-page-title-and-loader
    paths:
      - scripts/patch-title-type-guard.mjs
      - .github/workflows/apply-title-type-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-page-title-and-loader
          fetch-depth: 0
      - run: node scripts/patch-title-type-guard.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/enrichment/extractProduct.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Исправить типизацию товарного заголовка"
            git push origin HEAD:fix/product-page-title-and-loader
          fi
