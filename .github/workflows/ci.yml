name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/procosmetics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Commit generated package lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/price-import-mvp'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Обновить package-lock для PDF.js"
          git push origin HEAD:feat/price-import-mvp

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status

      - name: Upload TypeScript log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 3
