name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "security/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/procosmetics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --silent

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status

      - name: Upload TypeScript log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Production dependency audit
        id: dependency_audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > dependency-audit.log 2>&1
          status=$?
          cat dependency-audit.log
          exit $status

      - name: Warn about known dependency vulnerabilities
        if: steps.dependency_audit.outcome == 'failure'
        run: |
          echo "::warning::Production dependency audit found high/critical vulnerabilities. See dependency-audit-log artifact. Keep remediation PRs separate from normal feature work."

      - name: Upload dependency audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-log
          path: dependency-audit.log
          if-no-files-found: warn
          retention-days: 7
